<!-- M1 L1 : BASIC HTML -->

<!--Document type declaration-->
<!DOCTYPE html>

<!--Opening tag-->
<html>

<!--opening head tag; head section contains 'behind-the-scenes' information-->
<head>

    <!--Tells browser to use utf-8 character encoding-->
    <meta charset="utf-8">

    <!--Makes the browser responsive-->
    <meta name="viewport" content="width=device-width">

    <title> M1L1A1 - Structure of HTML </title> <!--This title goes on top of the page-->

<!--closing head tag-->
</head>

    <!--opening body tag; body section has what you can see on the website-->
    <body>

        Hello, my name is Diksha. <br> <!--Line break-->
        I am an instructor at Codingal. <br>

    <!--closing body tag-->
    </body>



<!--Closing tag-->
</html>
